name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_device_suite:
        description: Run complete paired journeys on API 23, 31, 36, and 37
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Repository checks and change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository.ps1
      - name: Detect application changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          code=true
          if [[ "$EVENT_NAME" != workflow_dispatch && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            if ! printf '%s\n' "$changed" | grep -vE '(^assets/|\.md$|^LICENSE$|^$)' > /dev/null; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read build requirements
        id: requirements
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          Import-Module ./scripts/BuildRequirements.psm1
          $required = Get-TunesLinkBuildRequirements -Root $env:GITHUB_WORKSPACE
          "java=$($required.JavaMajor)" >> $env:GITHUB_OUTPUT
          "platform=platforms;$($required.AndroidPlatformPackage)" >> $env:GITHUB_OUTPUT
          "build_tools=$($required.BuildToolsVersion)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ steps.requirements.outputs.java }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Install Android SDK 37
        run: >-
          sdkmanager "${{ steps.requirements.outputs.platform }}"
          "build-tools;${{ steps.requirements.outputs.build_tools }}"
      - name: Test build-requirement detection
        shell: pwsh
        run: ../scripts/build-requirements-self-test.ps1
      - name: Test GitHub release download retries
        shell: pwsh
        run: ../scripts/github-read-retry-self-test.ps1
      - name: Test Android integration selectors
        working-directory: ${{ github.workspace }}
        run: python3 scripts/android-integration-selector-self-test.py
      - name: Test visual comparison
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m venv "$RUNNER_TEMP/tuneslink-visual"
          "$RUNNER_TEMP/tuneslink-visual/bin/python" -m pip install -r scripts/requirements-visual.txt
          "$RUNNER_TEMP/tuneslink-visual/bin/python" scripts/android-visual-regression.py --self-test
      - name: Test Android UI contracts
        working-directory: ${{ github.workspace }}
        run: python3 scripts/android-ui-contract-self-test.py
      - name: Test emulator startup deadlines and retries
        working-directory: ${{ github.workspace }}
        run: python3 scripts/android-emulator-run-self-test.py
      - name: Validate and build
        run: >-
          ./gradlew --no-daemon --warning-mode all --dependency-verification strict
          :app:lintDebug :app:lintRelease :app:testDebugUnitTest
          :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Share debug APKs with the device matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuneslink-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Android release size budget
        shell: pwsh
        run: |
          $artifact = "app/build/outputs/apk/release/app-release-unsigned.apk"
          # Android 6 Java API backports bring the optimized APK to about 1.80 MiB. Keep a
          # deliberately tight ceiling while leaving room for deterministic
          # toolchain metadata changes between hosted runners.
          $budget = 1.90MB
          $size = (Get-Item -LiteralPath $artifact).Length
          if ($size -gt $budget) {
            throw "Android release APK is $size bytes; the budget is $budget bytes."
          }
      - name: Verify 16 KB page-size packaging
        run: >-
          "$ANDROID_HOME/build-tools/${{ steps.requirements.outputs.build_tools }}/zipalign"
          -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
      # Runs after the APK checks: this rebuild compiles the Play-only reviewer demo.
      - name: Validate Google Play bundle with demo mode
        run: >-
          ./gradlew --no-daemon --warning-mode all --dependency-verification strict
          -PTunesLink.playDemo=true :app:lintRelease :app:testDebugUnitTest :app:bundleRelease
      - name: Verify repository hygiene
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: ./scripts/verify-repository.ps1 -RequireCleanWorktree
  android-device:
    name: Android device validation
    needs: android
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-device.yml
    with:
      ref: ${{ github.sha }}
      full-suite: ${{ inputs.full_device_suite == true }}

  windows:
    name: Windows bridge
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build .\windows\TuneLink.sln --configuration Release
      - name: Verify responsive and accessibility window layouts
        shell: pwsh
        run: |
          $project = ".\windows\TuneLinkBridge.WinUI\TuneLinkBridge.WinUI.csproj"
          $cases = @(
            @("480x580", "1.0", "two-phones"),
            @("500x840", "1.0", "paired"),
            @("420x640", "2.0", "long-name"),
            @("500x840", "1.5", "both-errors"),
            @("420x640", "2.0", "runtime-unavailable")
          )
          foreach ($case in $cases) {
            dotnet run --project $project --configuration Release --no-build -- `
              --verify-layout --viewport $case[0] --text-scale $case[1] --ui-state $case[2]
            if ($LASTEXITCODE -ne 0) { throw "WinUI layout verification failed: $($case -join ', ')" }
          }
      - name: Verify formatting
        env:
          Configuration: Release
        run: dotnet format .\windows\TuneLink.sln --verify-no-changes --severity warn --no-restore
      - name: Regression suite
        run: dotnet run --project .\windows\TuneLinkBridge.Core.Tests\TuneLinkBridge.Core.Tests.csproj --configuration Release --no-build
      - name: Publish
        run: >-
          dotnet publish .\windows\TuneLinkBridge.WinUI\TuneLinkBridge.WinUI.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          --output .\artifacts\windows
      - name: Enforce Windows release size budget
        shell: pwsh
        run: |
          $size = (Get-Item ".\artifacts\windows\TunesLink.Bridge.exe").Length
          if ($size -gt 180MB) { throw "Windows executable is $size bytes; the budget is 180 MiB." }
          Compress-Archive -LiteralPath ".\artifacts\windows\TunesLink.Bridge.exe" `
            -DestinationPath "$env:RUNNER_TEMP\TunesLink-windows.zip"
          $compressedSize = (Get-Item "$env:RUNNER_TEMP\TunesLink-windows.zip").Length
          if ($compressedSize -gt 120MB) {
            throw "Compressed Windows artifact is $compressedSize bytes; the budget is 120 MiB."
          }
      - name: Verify published executable
        shell: pwsh
        run: |
          $executable = ".\artifacts\windows\TunesLink.Bridge.exe"
          $process = Start-Process -FilePath $executable `
            -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Published self-test failed with exit code $($process.ExitCode)." }
          $process = Start-Process -FilePath $executable `
            -ArgumentList "--verify-layout", "--viewport", "420x640", `
              "--text-scale", "2.0", "--ui-state", "runtime-unavailable" `
            -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Published UI verification failed with exit code $($process.ExitCode)."
          }
          $renamed = Join-Path $env:RUNNER_TEMP "TunesLink.Bridge (1).exe"
          Copy-Item -LiteralPath $executable -Destination $renamed -Force
          $process = Start-Process -FilePath $renamed `
            -ArgumentList "--verify-layout", "--viewport", "420x640", `
              "--text-scale", "2.0", "--ui-state", "runtime-unavailable" `
            -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Renamed-download UI verification failed with exit code $($process.ExitCode)."
          }
      - name: Verify repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository.ps1 -RequireCleanWorktree
