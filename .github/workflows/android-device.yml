name: Android device validation

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit under test
        required: true
        type: string
      debug-run-id:
        description: CI run containing debug APKs for ref (defaults to the calling run)
        default: ""
        type: string
      full-suite:
        description: Run all paired scenarios on API 23, 31, 36, and 37
        default: false
        type: boolean
      api-levels:
        description: JSON array of Android versions to validate
        default: "[23,26,31,36,37]"
        type: string
      release-artifact:
        description: >-
          Optional signed APK artifact from the calling release workflow. When set, only the
          signed APK and the upgrade from the previous release are tested: the release workflow
          requires CI, which already ran the debug suites on the same commit.
        default: ""
        type: string
      release-tag:
        description: Tag of the signed APK under test
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  android-device:
    name: Android device API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(inputs.api-levels) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Read build requirements
        id: requirements
        shell: pwsh
        run: |
          Import-Module ./scripts/BuildRequirements.psm1
          $required = Get-TunesLinkBuildRequirements -Root $env:GITHUB_WORKSPACE
          "java=$($required.JavaMajor)" >> $env:GITHUB_OUTPUT
          "platform=platforms;$($required.AndroidPlatformPackage)" >> $env:GITHUB_OUTPUT
          "build_tools=$($required.BuildToolsVersion)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ steps.requirements.outputs.java }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: inputs.release-artifact == '' && matrix.api-level != 26
        with:
          global-json-file: global.json
      - name: Download the debug APKs built by CI
        if: inputs.release-artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEBUG_RUN_ID: ${{ inputs.debug-run-id || github.run_id }}
        run: >-
          gh run download "$DEBUG_RUN_ID" --name tuneslink-android-debug
          --repo "$GITHUB_REPOSITORY" --dir android/app/build/outputs/apk
      - name: Download the signed release APK under test
        if: inputs.release-artifact != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.release-artifact }}
        run: >-
          gh run download "$GITHUB_RUN_ID" --name "$RELEASE_ARTIFACT"
          --repo "$GITHUB_REPOSITORY" --dir artifacts/device-release
      - name: Download the previous published APK for upgrade testing
        if: inputs.release-artifact != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          Import-Module ./scripts/GitHubReadRetry.psm1
          $releases = Invoke-TunesLinkGitHubRead -ArgumentList @(
            "release", "list", "--repo", $env:GITHUB_REPOSITORY, "--limit", "100",
            "--json", "tagName,isDraft,isPrerelease"
          ) -FailureMessage "Could not list previous GitHub releases" | ConvertFrom-Json
          $previous = $releases | Where-Object {
            -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne $env:RELEASE_TAG
          } | Select-Object -First 1
          if ($null -ne $previous) {
            New-Item -ItemType Directory -Force artifacts/device-previous | Out-Null
            Invoke-TunesLinkGitHubRead -ArgumentList @(
              "release", "download", $previous.tagName, "--repo", $env:GITHUB_REPOSITORY,
              "--pattern", "TunesLink.apk", "--dir", "artifacts/device-previous", "--clobber"
            ) -FailureMessage "Could not download $($previous.tagName) APK" | Out-Null
          }
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ""
      # API 23 still compiles the small font-scale helper, even with a prebuilt APK.
      - name: Install legacy settings helper build requirements
        if: matrix.api-level == 23
        run: >-
          sdkmanager "${{ steps.requirements.outputs.platform }}"
          "build-tools;${{ steps.requirements.outputs.build_tools }}"
      - name: Install and configure emulator
        timeout-minutes: 10
        env:
          IMAGE_PLATFORM: ${{ matrix.api-level == 37 && '37.0' || matrix.api-level }}
          IMAGE_TARGET: google_apis
        run: |
          # Share one explicit AVD location across creation, configuration, and launch.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tuneslink-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          image="system-images;android-${IMAGE_PLATFORM};${IMAGE_TARGET};x86_64"
          # Older avdmanager versions parse 37.0 as android-0, disabling the
          # renderer features this image needs and crashing SurfaceFlinger.
          sdkmanager "cmdline-tools;23.0"
          tools="$ANDROID_HOME/cmdline-tools/23.0/bin"
          "$tools/sdkmanager" "platform-tools" "emulator" "$image"
          mkdir -p "$ANDROID_AVD_HOME"
          avd_path="$ANDROID_AVD_HOME/tuneslink-ci.avd"
          echo no | "$tools/avdmanager" create avd --force --name tuneslink-ci --package "$image" --device pixel_2 --path "$avd_path"
          grep -Fx "target=android-${IMAGE_PLATFORM}" "$ANDROID_AVD_HOME/tuneslink-ci.ini"
          test -s "$avd_path/config.ini"
          printf '\nhw.cpu.ncore=2\nhw.heapSize=512M\n' >> "$avd_path/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx tuneslink-ci
          "$ANDROID_HOME/emulator/emulator" -no-window -version
      - name: Exercise phone and tablet viewports
        timeout-minutes: 30
        env:
          # API 23's old kernel faults in framebuffer setup with 4 GiB RAM.
          EMULATOR_RAM_MB: ${{ matrix.api-level == 23 && 2048 || 4096 }}
          TunesLink_DEVICE_PROFILE: >-
            ${{ (inputs.full-suite || matrix.api-level == 23 || matrix.api-level == 37)
                && 'full' || (matrix.api-level == 36 && 'visual' || 'quick') }}
          # Preserve API 26's original smoke scope; see test-support/README.md.
          RUN_INTEGRATION: ${{ matrix.api-level != 26 }}
          RELEASE_ARTIFACT: ${{ inputs.release-artifact }}
        run: |
          python3 scripts/android-emulator-run.py --avd tuneslink-ci \
            --emulator "$ANDROID_HOME/emulator/emulator" --memory "$EMULATOR_RAM_MB" --wipe-data -- \
            bash -euo pipefail -c '
              if [[ -n "$RELEASE_ARTIFACT" ]]; then
                bash scripts/android-release-smoke.sh
              else
                bash scripts/android-cache-device-test.sh
                bash scripts/android-emulator-smoke.sh
                if [[ "$RUN_INTEGRATION" == "true" ]]; then bash scripts/android-emulator-integration.sh; fi
              fi
            '
      - name: Verify Android visual baselines
        if: matrix.api-level == 36 && inputs.release-artifact == ''
        run: |
          python3 -m venv "$RUNNER_TEMP/tuneslink-visual"
          "$RUNNER_TEMP/tuneslink-visual/bin/python" -m pip install -r scripts/requirements-visual.txt
          "$RUNNER_TEMP/tuneslink-visual/bin/python" scripts/android-visual-regression.py
      - name: Verify repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository.ps1 -RequireCleanWorktree
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-device-${{ inputs.release-artifact != '' && 'release' || 'debug' }}-api-${{ matrix.api-level }}
          path: |
            android/app/build/reports/device-emulator
            android/app/build/reports/device-smoke
            android/app/build/reports/device-integration
            android/app/build/reports/device-cache
            android/app/build/reports/device-release-smoke
          if-no-files-found: warn
          retention-days: 14
