buildscript {
    dependencies {
        // Keep AGP's built-in Kotlin compiler aligned with the Compose plugin.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21"
        // AGP still brings older security-sensitive tools. Keep these fixes on the
        // build classpath; they must not become Android runtime dependencies.
        constraints {
            classpath("org.bouncycastle:bcpkix-jdk18on:1.86") {
                because "Fix GHSA-wg6q-6289-32hp and align the Bouncy Castle modules"
            }
            classpath("org.bouncycastle:bcprov-jdk18on:1.86") {
                because "Fix certificate/ASN.1 parsing advisories in AGP's older provider"
            }
            classpath("org.bouncycastle:bcutil-jdk18on:1.86") {
                because "Keep Bouncy Castle utilities aligned with the provider and PKIX"
            }
            classpath("com.google.guava:guava:33.8.0-jre") {
                because "Fix GHSA-xxph-c9ww-hj94 (untrusted deserialization allocation)"
            }
            classpath("org.apache.commons:commons-lang3:3.21.0") {
                because "Fix GHSA-j288-q9x7-2f5v (unbounded recursion)"
            }
            classpath("org.bitbucket.b_c:jose4j:0.9.7") {
                because "Fix GHSA-3677-xxcr-wjqv (compressed JWE resource exhaustion)"
            }
            classpath("org.jdom:jdom2:2.0.6.1") {
                because "Fix GHSA-2363-cqg2-863c (XML external entities)"
            }
        }
    }
}

plugins {
    id "com.android.application" version "9.5.1" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.21" apply false
}
